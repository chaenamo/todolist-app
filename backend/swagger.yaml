# =============================================================================
# TodoList 백엔드 API 명세 (OpenAPI 3.0.3)
# 파일: backend/swagger.yaml
#
# 버전 이력  (최신 버전은 info.version과 동기화: v0.1 <-> 0.1.0)
# | 버전 | 일자       | 작성자   | 상태 | 비고      |
# |------|------------|----------|------|-----------|
# | v0.1 | 2026-11-04 | chaenamo | 초안 | 최초 작성 |
#
# 변경 이력
# | 버전 | 일자       | 변경 범위 | 변경 내용                                                                                          | 변경자   |
# |------|------------|-----------|----------------------------------------------------------------------------------------------------|----------|
# | v0.1 | 2026-11-04 | 전체      | 8-plan BE-01 잠정 엔드포인트 19개, 공통 스키마(User/Category/Todo/목록/에러/토큰), bearerAuth(HS384) 최초 작성 | chaenamo |
#
# 기준 문서: docs/1-domain-definition.md (v0.3), docs/2-PRD.md (v0.4), docs/3-user-scenario.md (v0.5),
#            docs/4-wireframe.md (v0.5), docs/5-project-principle.md (v0.4), docs/6-arch-diagram.md (v0.5),
#            docs/7-erd.md (v0.3), docs/schema.sql, docs/8-plan.md (v0.3)
# 문서 간 판단 우선순위: 8-plan 7장 > 6-arch-diagram > 5-project-principle. "잠정" = 8-plan 7장 잠정값 또는 문서 미확정.
# 갱신 규칙:
#   - 엔드포인트(경로·메서드)·operationId·스키마 이름·필드·에러 코드를 추가/변경/삭제하면 위 두 표에 한 행을 추가하고
#     info.version을 같은 버전으로 올린다(v0.N <-> 0.N.0).
#   - 기준 문서 ID(BR, AC, PR, AQ, G 등)는 참조만 하며 이 파일에서 재정의하지 않는다.
# =============================================================================
openapi: 3.0.3

info:
  title: TodoList API
  version: 0.1.0
  description: |
    개인별 할일·카테고리·캘린더 관리 API (MVP). 계약 근거는 `docs/8-plan.md` BE-01.

    **인증 (PR-37, NFR-10)**
    - Access token: JWT **HS384**, 만료 15분, claims `sub`(userId)·`iat`·`exp`. `Authorization: Bearer <accessToken>`.
    - Refresh token: 불투명 무작위 문자열, 만료 14일, **회전 없음**. 요청 body로 전달(`POST /api/auth/refresh`, `POST /api/auth/logout`).
    - 공개 경로: `GET /health`, `/api/auth/*`(signup, login, refresh, logout). 그 외 `/api/*`는 Bearer 필수.
    - 클라이언트 규칙(PR-16): 보호 요청 401 → refresh 1회(single-flight) → 원 요청 1회 재시도. 인증 엔드포인트의 401은 이 처리에서 제외.

    **에러 형식 (PR-20, PR-46)**
    `{ "error": { "code", "message", "fields"? } }`. `fields`는 필드 오류일 때만(키 = 요청 필드명, 값 = 한국어 문구).
    코드↔상태: `VALIDATION_ERROR` 400, `FORBIDDEN_OPERATION` 400, `UNAUTHORIZED` 401, `NOT_FOUND` 404, `CONFLICT` 409, `INTERNAL` 500.
    `message`는 사용자에게 그대로 보여 줄 한국어 문구(PR-21). 500은 내부 정보 없이 일반 문구.

    **소유권 (NFR-12, PR-10)**: 타인 소유 할일·카테고리는 존재 여부를 숨기고 404로 응답한다.

    **형식**
    - JSON 필드는 camelCase. 성공 응답은 래핑 없이 데이터 그대로.
    - 날짜(시작일자·종료일자·today·from·to)는 `YYYY-MM-DD` 문자열(PR-04), 실제 존재하는 날짜만 허용(`2026-02-30` 거부). 타임존 변환 없음.
    - 일시(createdAt·updatedAt·completedAt)는 ISO 8601 date-time.
    - id는 DB `bigint`지만 JSON **number**로 직렬화한다(PQ-03, 2^53 미만 가정).

    **페이지네이션 (PR-43, NFR-06)**: 할일 목록만 `{ items, page, limit, total }`. `page`는 1부터, `limit` 기본 50·최대 100(초과 값은 100으로 절삭).
    페이지 없는 목록(카테고리, 캘린더)은 `{ items }`.

    **범위 밖**: Rate limiting·로그인 시도 제한은 MVP 제외(U-10). 캐시 헤더 정책 없음.

servers:
  - url: http://localhost:3000
    description: 로컬 개발 (backend/.env.example PORT=3000)
  # 운영 서버 URL은 배포 환경 미정(U-01). OPS-01에서 확정 후 추가한다.

tags:
  - name: Health
    description: 헬스체크 (PR-45)
  - name: Auth
    description: 회원가입·로그인·토큰 갱신·로그아웃 (UC-01, UC-02, PR-37)
  - name: Me
    description: 내 정보 조회·수정 (UC-03)
  - name: Categories
    description: 카테고리 (UC-04)
  - name: Todos
    description: 할일 CRUD·목록·완료 토글 (UC-05~09)
  - name: Calendar
    description: 캘린더 기간 조회 (UC-10)

# 기본: 모든 operation에 Bearer 필요. 공개 operation은 security: []로 덮어쓴다(PR-07).
security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: 헬스체크
      description: |
        인증 없음. DB `SELECT 1` 성공 시 200, 실패 시 503 (PR-45, AQ-07, BE-02).
      security: []
      responses:
        '200':
          description: 정상
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: DB 연결 실패. 본문 형식은 문서에 정해지지 않음(잠정).

  /api/auth/signup:
    post:
      tags: [Auth]
      operationId: signup
      summary: 회원가입
      description: |
        사용자 + '기본' 카테고리 + refresh token을 한 트랜잭션으로 생성하고 토큰 쌍을 발급한다(자동 로그인).
        관련: UC-01, BR-03, BR-05, G-01, AD-06, PR-11, PR-37, SC-01-E1, SC-01-E2, BE-05.
        검증 길이·비밀번호 규칙·이메일 대소문자 구분은 G-05 **잠정**값.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            example:
              email: user@example.com
              password: password1234
              name: 홍길동
      responses:
        '201':
          description: 가입 성공. 토큰 쌍과 사용자 정보.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                accessToken: eyJhbGciOiJIUzM4NCIsInR5cCI6IkpXVCJ9.eyJzdWIiOjEsImlhdCI6MTc5MzgwMDAwMCwiZXhwIjoxNzkzODAwOTAwfQ.signature
                refreshToken: kJ3x8w2QdZ0yq9vR1mN6tB4cL7pE5sH2aU0iO3fG8jY
                user:
                  id: 1
                  email: user@example.com
                  name: 홍길동
                  createdAt: '2026-11-04T09:00:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: 이메일 중복 (BR-03, `uq_users_email` → `fields.email`, PR-46).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: CONFLICT
                  message: 이미 사용 중인 이메일입니다
                  fields:
                    email: 이미 사용 중인 이메일입니다
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 로그인
      description: |
        이메일·비밀번호 확인 후 토큰 쌍 발급. 성공 시 그 사용자의 만료된 refresh token 행을 정리한다.
        실패는 미가입 이메일/비밀번호 불일치를 구분하지 않는 단일 401 문구(G-04).
        관련: UC-02, G-04, AD-07, PR-36, PR-37, NFR-03, SC-02-E1, BE-05.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: user@example.com
              password: password1234
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: 인증 실패 (계정 존재 여부를 구분하지 않는 단일 문구, G-04). 클라이언트 공통 401 처리 대상 아님(AQ-01).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHORIZED
                  message: 이메일 또는 비밀번호가 올바르지 않습니다
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshAccessToken
      summary: Access token 갱신
      description: |
        body의 refresh token(SHA-256 해시로 조회, 만료 전만 유효)으로 새 access token을 발급한다.
        refresh token은 회전하지 않으므로 응답에 새 refresh token이 없고, 같은 토큰으로 반복 호출해도 200.
        Authorization 헤더 불필요(공개 경로, PR-07).
        관련: NFR-10, PR-16, PR-37, AD-07, AD-13, SC-02-A1, SC-00-E2, BE-05.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: 새 access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: refresh token 없음·만료·폐기(로그아웃·비밀번호 변경). 클라이언트는 다시 refresh하지 않고 로그아웃 처리(PR-16).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHORIZED
                  message: 다시 로그인해 주세요
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 로그아웃 (refresh token 서버 폐기)
      description: |
        해당 refresh token 행을 삭제한다. 행이 없어도 204(멱등). Authorization 헤더 불필요(공개 경로).
        클라이언트는 응답과 관계없이 로컬 토큰을 폐기한다.
        관련: A-14, PR-16, PR-37, AD-07, BE-05.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: 폐기 완료(이미 없던 토큰 포함)
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/users/me:
    get:
      tags: [Me]
      operationId: getMe
      summary: 내 정보 조회
      description: 관련 UC-03, PR-36(해시 비노출), BE-11.
      responses:
        '200':
          description: 내 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Me]
      operationId: updateMe
      summary: 이름 변경
      description: |
        이름만 변경한다(trim 후 저장). 이메일은 변경할 수 없다(A-06, BR-04).
        본문의 `name` 외 필드(예: `email`)를 무시할지 400으로 거부할지는 문서 미확정(**잠정**, BE-11 "무시 또는 400, 계약대로").
        어느 쪽이든 이메일은 바뀌지 않는다.
        관련: UC-03, BR-04, SC-10-E2, SC-10-E3, G-05, BE-11.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
            example:
              name: 새이름
      responses:
        '200':
          description: 변경된 내 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/users/me/password:
    put:
      tags: [Me]
      operationId: changeMyPassword
      summary: 비밀번호 변경
      description: |
        현재 비밀번호 확인 후 변경. 한 트랜잭션에서 그 사용자의 모든 refresh token을 폐기하고 현재 세션용 새 refresh token을 발급해 응답한다(G-06).
        기존 access token은 만료(최대 15분)까지 유효. 다른 기기는 access 만료 후 refresh 401로 로그아웃된다.
        현재 비밀번호 불일치는 401이 아닌 **400 `fields.currentPassword`**(PQ-02, 401이면 클라이언트 공통 401 처리로 로그아웃됨). 이때 refresh token은 삭제되지 않는다.
        관련: UC-03, BR-04, A-08, G-06, PQ-02, PR-11, PR-37, SC-10-E1, BE-11.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: 변경 성공. 현재 세션용 새 refresh token(클라이언트는 저장값을 교체).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '400':
          description: 검증 실패. 현재 비밀번호 불일치(`fields.currentPassword`, PQ-02) 또는 새 비밀번호 규칙 위반(`fields.newPassword`, G-05).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                currentPasswordMismatch:
                  summary: 현재 비밀번호 불일치 (PQ-02)
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: 입력값을 확인해 주세요
                      fields:
                        currentPassword: 현재 비밀번호가 일치하지 않습니다
                newPasswordRule:
                  summary: 새 비밀번호 규칙 위반 (G-05 잠정)
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: 입력값을 확인해 주세요
                      fields:
                        newPassword: 비밀번호는 8~72자여야 합니다
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/categories:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: 카테고리 목록
      description: |
        본인 카테고리 전체(페이지 없음). 정렬: '기본' 먼저, 이후 이름순.
        관련: UC-04, BR-02, NFR-12, BE-06.
      responses:
        '200':
          description: 카테고리 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
              example:
                items:
                  - id: 1
                    name: 기본
                    isDefault: true
                  - id: 2
                    name: 업무
                    isDefault: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Categories]
      operationId: createCategory
      summary: 카테고리 등록
      description: |
        이름은 앞뒤 공백 제거 후 저장·비교, 사용자 내 고유('기본' 포함). 길이는 G-05 **잠정**.
        관련: UC-04, FR-02, BR-07, SC-03-E1, SC-03-E2, AQ-02, BE-06.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryNameRequest'
            example:
              name: '  업무  '
      responses:
        '201':
          description: 등록된 카테고리(이름은 trim된 값)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
              example:
                id: 2
                name: 업무
                isDefault: false
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/CategoryNameConflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/categories/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Categories]
      operationId: renameCategory
      summary: 카테고리 이름 변경 (Should)
      description: |
        사용자 카테고리 이름 변경(trim, 사용자 내 고유). '기본' 카테고리는 400 `FORBIDDEN_OPERATION`(BR-06).
        타인·없는 카테고리는 404(존재 여부 비노출, NFR-12).
        관련: UC-04, BR-06, BR-07, SC-03-A1, SC-03-E3, M-05, BE-12.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryNameRequest'
      responses:
        '200':
          description: 변경된 카테고리
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/CategoryBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CategoryNameConflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Categories]
      operationId: deleteCategory
      summary: 카테고리 삭제 (Should)
      description: |
        한 트랜잭션에서 소속 할일을 '기본'으로 이동한 뒤 삭제(BR-09, PR-11). '기본' 카테고리는 400 `FORBIDDEN_OPERATION`(BR-06).
        타인·없는 카테고리는 404(NFR-12). 동시 요청 경합으로 FK 위반(23503)이 나면 `fields` 없는 409(재시도 안내, EQ-01 **잠정**).
        관련: UC-04, BR-06, BR-09, AD-11, SC-03-A2, EQ-01, M-05, BE-12.
      responses:
        '204':
          description: 삭제 완료
        '400':
          $ref: '#/components/responses/CategoryBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RetryConflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/todos:
    get:
      tags: [Todos]
      operationId: listTodos
      summary: 할일 목록 (필터·페이지네이션)
      description: |
        `today`(브라우저 로컬 날짜) 기준으로 각 항목에 `status`를 붙여 반환한다(PR-03, PR-05).
        필터: 카테고리(단일) AND 상태(복수, OR)(BR-15). 미지정 조건은 전체.
        정렬: 종료일자 → 생성일시 → id 오름차순(Q-05, AQ-08).
        타인 `categoryId`로 필터하면 404가 아니라 빈 결과(`total = 0`)(NFR-12, BE-08).
        관련: UC-06, AC-03, AC-04, ST-01~04, NFR-06, PR-38, PR-43, AD-08, U-04, BE-08.
      parameters:
        - $ref: '#/components/parameters/TodayQuery'
        - name: categoryId
          in: query
          required: false
          description: 카테고리 필터(단일). 양의 정수.
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: status
          in: query
          required: false
          description: |
            상태 필터(복수, 쉼표 구분, 상태 간 OR). 예: `status=NOT_STARTED,IN_PROGRESS` (U-04).
            목록 밖 값이 하나라도 있으면 400 (PR-38).
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/TodoStatus'
        - name: page
          in: query
          required: false
          description: 페이지 번호(1부터, 기본 1). 0·음수·숫자 아님 → 400.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: |
            페이지 크기(기본 50). **100 초과 값은 오류가 아니라 100으로 절삭**되고 응답 `limit`에 실제 적용값이 담긴다(PR-43).
            0·음수·숫자 아님 → 400.
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        '200':
          description: 할일 목록(각 항목에 status 포함)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoListResponse'
              example:
                items:
                  - id: 10
                    categoryId: 2
                    title: 보고서
                    description: null
                    startDate: '2026-11-10'
                    endDate: '2026-11-12'
                    isCompleted: false
                    completedAt: null
                    createdAt: '2026-11-04T09:10:00.000Z'
                    updatedAt: '2026-11-04T09:10:00.000Z'
                    status: OVERDUE
                page: 1
                limit: 50
                total: 1
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Todos]
      operationId: createTodo
      summary: 할일 등록
      description: |
        `categoryId` 생략 시 본인 '기본' 카테고리(BR-08, AC-01). 지정한 `categoryId`가 타인·없는 카테고리면 400 `fields.categoryId`(AQ-06 **잠정**).
        `endDate >= startDate`(같은 날 허용, BR-11), 과거 날짜 허용(BR-12). 위반 시 400 `fields.endDate`(AC-02).
        제목은 trim 후 저장(EQ-03). 정의되지 않은 필드(예: `isCompleted`)는 400(BE-07).
        응답에 `status` 없음 — 쓰기 요청에는 `today`가 없으므로 재조회로 표시(AQ-09 **잠정**).
        카테고리 확인과 INSERT 사이 카테고리 삭제 경합 시 `fields` 없는 409(EQ-01 **잠정**).
        관련: UC-05, BR-08, BR-10~12, AC-01, AC-02, NFR-12, NFR-13, PR-10, AD-09, BE-07.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoInput'
            example:
              title: 발표 준비
              description: 슬라이드 20장
              categoryId: 2
              startDate: '2026-11-13'
              endDate: '2026-11-16'
      responses:
        '201':
          description: 등록된 할일(status 없음)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          $ref: '#/components/responses/TodoValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/RetryConflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/todos/calendar:
    get:
      tags: [Calendar]
      operationId: listCalendarTodos
      summary: 캘린더 기간 조회
      description: |
        `from`~`to`(양 끝 포함)과 하루라도 겹치는 할일(`startDate <= to AND endDate >= from`)을 `today` 기준 `status`와 함께 반환(BR-16).
        페이지 없음, 응답 `{ items }`. 기간은 최대 42일(월간 6주 그리드). `from > to` 또는 43일 이상이면 400(AQ-05 **잠정**).
        정렬: 시작일자 → id 오름차순. 경로는 `/api/todos/{id}`보다 먼저 매칭된다.
        관련: UC-10, AC-05, AC-06, BR-16, NFR-06, PR-43, AD-12, AQ-05, BE-10.
      parameters:
        - name: from
          in: query
          required: true
          description: 뷰 시작일(포함), YYYY-MM-DD
          schema:
            type: string
            format: date
            example: '2026-11-01'
        - name: to
          in: query
          required: true
          description: 뷰 종료일(포함), YYYY-MM-DD. `from <= to`, `to - from + 1 <= 42`.
          schema:
            type: string
            format: date
            example: '2026-12-12'
        - $ref: '#/components/parameters/TodayQuery'
      responses:
        '200':
          description: 기간과 겹치는 할일(각 항목에 status 포함)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/todos/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Todos]
      operationId: getTodo
      summary: 할일 상세
      description: |
        응답에 `status` 없음(AQ-09 **잠정**). 타인·없는 할일은 404(존재 여부 비노출, NFR-12, SC-00-E3).
        관련: UC-07, NFR-12, AD-09, BE-07.
      responses:
        '200':
          description: 할일
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Todos]
      operationId: updateTodo
      summary: 할일 수정
      description: |
        등록과 같은 필드·검증(BR-17). 전체 교체 의미이며 `categoryId` 생략(또는 null) 시 '기본'으로 바뀐다(SC-07-A2).
        `isCompleted`는 보낼 수 없다(400, AQ-10 **잠정**). 완료 여부·완료일시는 유지되고 `updatedAt`만 갱신(SC-07-A1, A-15).
        타인·없는 할일은 404(NFR-12, SC-07-E2, SC-07-E3). 타인·없는 `categoryId`는 400 `fields.categoryId`(AQ-06 **잠정**).
        응답에 `status` 없음(AQ-09 **잠정**). 경합 시 `fields` 없는 409(EQ-01 **잠정**).
        관련: UC-07, BR-08, BR-10~12, BR-17, AQ-10, AD-09, BE-07.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoInput'
      responses:
        '200':
          description: 수정된 할일(status 없음)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          $ref: '#/components/responses/TodoValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RetryConflict'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Todos]
      operationId: setTodoCompleted
      summary: 할일 완료 / 완료 취소
      description: |
        본문은 `{ isCompleted }`만 허용(다른 필드·boolean 아닌 값 → 400). 완료 시 `completedAt = now()`, 취소 시 `null`(BR-13).
        응답에 `status` 없음 — 클라이언트는 목록·캘린더를 재조회(AQ-03, AQ-09 **잠정**).
        타인·없는 할일은 404(NFR-12).
        관련: UC-08, BR-13, A-07, AD-10, AQ-10, BE-09.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoCompletionRequest'
            example:
              isCompleted: true
      responses:
        '200':
          description: 갱신된 할일(status 없음)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
              example:
                id: 11
                categoryId: 2
                title: 발표 준비
                description: 슬라이드 20장
                startDate: '2026-11-13'
                endDate: '2026-11-16'
                isCompleted: true
                completedAt: '2026-11-13T10:00:00.000Z'
                createdAt: '2026-11-04T09:20:00.000Z'
                updatedAt: '2026-11-13T10:00:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Todos]
      operationId: deleteTodo
      summary: 할일 삭제
      description: |
        영구 삭제(BR-14). 이미 삭제됐거나 타인 할일이면 404(NFR-12, SC-08-E1).
        관련: UC-09, BR-14, BE-07.
      responses:
        '204':
          description: 삭제 완료
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token. JWT **HS384**(서버는 `algorithms: ['HS384']`로만 검증, HS256·`alg: none` 토큰은 401), 만료 **15분**,
        claims `sub`(userId)·`iat`·`exp`만. 없음·서명 불일치·만료 → 401 `UNAUTHORIZED` (PR-37, NFR-10).

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: 리소스 id(양의 정수). 숫자가 아니면 400. 타인 리소스 id는 404(NFR-12).
      schema:
        type: integer
        format: int64
        minimum: 1
    TodayQuery:
      name: today
      in: query
      required: true
      description: 브라우저 로컬 기준 오늘 날짜 YYYY-MM-DD. 상태 판정·필터 기준(PR-05, A-01). 누락·형식 오류 → 400.
      schema:
        type: string
        format: date
        example: '2026-11-13'

  responses:
    ValidationError:
      description: 입력 검증 실패 `VALIDATION_ERROR` (PR-20, PR-39). 필드 오류면 `fields`에 담는다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: 입력값을 확인해 주세요
              fields:
                email: 이메일 형식이 올바르지 않습니다
    TodoValidationError:
      description: 할일 입력 검증 실패. 종료일자 < 시작일자는 `fields.endDate`(AC-02), 타인·없는 카테고리는 `fields.categoryId`(AQ-06 잠정).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            endDateBeforeStartDate:
              summary: 종료일자 < 시작일자 (AC-02, BR-11)
              value:
                error:
                  code: VALIDATION_ERROR
                  message: 입력값을 확인해 주세요
                  fields:
                    endDate: 종료일자는 시작일자 이후여야 합니다
            invalidCategory:
              summary: 타인·없는 카테고리 (AQ-06 잠정)
              value:
                error:
                  code: VALIDATION_ERROR
                  message: 입력값을 확인해 주세요
                  fields:
                    categoryId: 카테고리를 찾을 수 없습니다
    CategoryBadRequest:
      description: 입력 검증 실패(`VALIDATION_ERROR`) 또는 '기본' 카테고리 변경·삭제 시도(`FORBIDDEN_OPERATION`, BR-06).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbiddenDefault:
              summary: "'기본' 카테고리 변경·삭제 (BR-06)"
              value:
                error:
                  code: FORBIDDEN_OPERATION
                  message: "'기본' 카테고리는 변경하거나 삭제할 수 없습니다"
            blankName:
              summary: 공백만 입력한 이름 (BR-07)
              value:
                error:
                  code: VALIDATION_ERROR
                  message: 입력값을 확인해 주세요
                  fields:
                    name: 이름을 입력하세요
    Unauthorized:
      description: 인증 실패 `UNAUTHORIZED` — access token 없음·서명 불일치·만료·HS384 아님(PR-37). 클라이언트는 refresh 1회 후 재시도(PR-16).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHORIZED
              message: 로그인이 필요합니다
    NotFound:
      description: 리소스 없음 또는 타인 소유 `NOT_FOUND` — 존재 여부를 구분하지 않는다(NFR-12). 미등록 경로도 같은 형식.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: 찾을 수 없습니다
    CategoryNameConflict:
      description: 카테고리 이름 중복 `CONFLICT` (BR-07, `uq_categories_user_id_name` → `fields.name`, PR-46).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: CONFLICT
              message: 이미 있는 이름입니다
              fields:
                name: 이미 있는 이름입니다
    RetryConflict:
      description: 동시 요청 경합으로 인한 FK 위반(23503 `fk_todos_category_owner`) `CONFLICT`, `fields` 없음. 재시도 안내 문구(EQ-01 잠정).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: CONFLICT
              message: 다른 변경과 충돌했습니다. 다시 시도해 주세요
    InternalError:
      description: 서버 오류 `INTERNAL`. 내부 정보(스택·SQL) 없이 일반 문구(PR-21, PR-46).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL
              message: 일시적인 오류가 발생했습니다. 잠시 후 다시 시도해 주세요

  schemas:
    # ---------- 공통 ----------
    Id:
      type: integer
      format: int64
      minimum: 1
      description: bigint identity. JSON number로 직렬화(PQ-03).
    TodoStatus:
      type: string
      description: |
        파생 상태(저장하지 않음, PR-03). 판정 순서: 완료 → 기한 초과 → 진행 중 → 시작 전.
        COMPLETED(ST-01) 완료 / NOT_STARTED(ST-02) today < startDate / IN_PROGRESS(ST-03) startDate ≤ today ≤ endDate / OVERDUE(ST-04) today > endDate.
      enum: [NOT_STARTED, IN_PROGRESS, COMPLETED, OVERDUE]
    ErrorCode:
      type: string
      description: VALIDATION_ERROR 400, FORBIDDEN_OPERATION 400, UNAUTHORIZED 401, NOT_FOUND 404, CONFLICT 409, INTERNAL 500 (PR-20).
      enum: [VALIDATION_ERROR, UNAUTHORIZED, NOT_FOUND, CONFLICT, FORBIDDEN_OPERATION, INTERNAL]
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: 사용자에게 그대로 표시할 한국어 문구(PR-21)
        fields:
          type: object
          description: 필드 오류일 때만. 키 = 요청 필드명(camelCase), 값 = 한국어 문구.
          additionalProperties:
            type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    # ---------- 엔터티 ----------
    User:
      type: object
      description: 비밀번호 해시는 어떤 응답에도 포함하지 않는다(NFR-09, PR-36).
      required: [id, email, name, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        email:
          type: string
          format: email
        name:
          type: string
        createdAt:
          type: string
          format: date-time
      example:
        id: 1
        email: user@example.com
        name: 홍길동
        createdAt: '2026-11-04T09:00:00.000Z'
    Category:
      type: object
      required: [id, name, isDefault]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          description: trim된 이름(BR-07)
        isDefault:
          type: boolean
          description: "'기본' 카테고리 여부. true면 이름 변경·삭제 불가(BR-06)."
    Todo:
      type: object
      description: 쓰기·단건 조회 응답. `status` 없음(AQ-09 잠정).
      required: [id, categoryId, title, description, startDate, endDate, isCompleted, completedAt, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        categoryId:
          $ref: '#/components/schemas/Id'
        title:
          type: string
        description:
          type: string
          nullable: true
        startDate:
          type: string
          format: date
          example: '2026-11-13'
        endDate:
          type: string
          format: date
          example: '2026-11-16'
        isCompleted:
          type: boolean
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: 완료면 일시, 미완료면 null(BR-13, CN-15)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TodoWithStatus:
      description: 목록·캘린더 조회 항목. 요청의 `today` 기준 파생 상태 포함(PR-03, PR-05).
      allOf:
        - $ref: '#/components/schemas/Todo'
        - type: object
          required: [status]
          properties:
            status:
              $ref: '#/components/schemas/TodoStatus'

    # ---------- 목록 응답 ----------
    TodoListResponse:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TodoWithStatus'
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: 실제 적용된 페이지 크기(100 초과 요청은 100)
        total:
          type: integer
          minimum: 0
          description: 같은 필터 조건의 전체 건수
    CalendarResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TodoWithStatus'
    CategoryListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Category'

    # ---------- 인증 ----------
    TokenPair:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken:
          type: string
          description: JWT HS384, 15분
        refreshToken:
          type: string
          description: 불투명 무작위 문자열(base64url), 14일, 회전 없음
    AuthResponse:
      description: 가입·로그인 응답
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          required: [user]
          properties:
            user:
              $ref: '#/components/schemas/User'
    AccessTokenResponse:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string
          description: 새 access token(JWT HS384, 15분). refresh token은 회전하지 않아 포함하지 않음.
    RefreshTokenResponse:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: 비밀번호 변경 후 현재 세션용 새 refresh token(G-06)

    # ---------- 요청 바디 ----------
    SignupRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: 이메일 형식, 최대 254자, 대소문자 구분(입력값 그대로 저장·비교) — G-05 잠정, CN-02.
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: 8~72자(bcrypt 72바이트 한계) — G-05 잠정.
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: trim 후 1~50자, 공백만 불가 — G-05 잠정, CN-03.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
          description: 누락·문자열 아님 → 400 `VALIDATION_ERROR`
    UpdateMeRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: trim 후 1~50자, 공백만 불가 — G-05 잠정, SC-10-E2.
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          description: 불일치 → 400 `fields.currentPassword` (PQ-02)
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
          description: 8~72자 — G-05 잠정. 위반 → 400 `fields.newPassword`.
    CategoryNameRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
          description: 앞뒤 공백 제거 후 1~30자(BR-07, 길이 G-05 잠정). 공백만 → 400 `fields.name`.
    TodoInput:
      type: object
      description: 등록(POST)·수정(PUT) 공용(BR-17). 정의되지 않은 필드(`isCompleted` 등)는 400(AQ-10).
      additionalProperties: false
      required: [title, startDate, endDate]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          description: trim 후 저장, 1~100자, 공백만 불가(BR-10, EQ-03, 길이 G-05 잠정)
        description:
          type: string
          nullable: true
          maxLength: 1000
          description: 선택, 최대 1,000자(G-05 잠정). PUT에서 생략·null이면 비움(잠정).
        categoryId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: 선택. 생략 시 '기본'(BR-08). 타인·없는 id → 400 `fields.categoryId`(AQ-06 잠정). null 허용은 잠정(SC-07-A2 "비우면 '기본'").
        startDate:
          type: string
          format: date
          description: YYYY-MM-DD, 실제 날짜. 과거 허용(BR-12).
        endDate:
          type: string
          format: date
          description: YYYY-MM-DD, 실제 날짜, `endDate >= startDate`(같은 날 허용, BR-11). 위반 → 400 `fields.endDate`.
    TodoCompletionRequest:
      type: object
      description: 완료 토글 전용. `isCompleted` 외 필드 → 400(BE-09).
      additionalProperties: false
      required: [isCompleted]
      properties:
        isCompleted:
          type: boolean
